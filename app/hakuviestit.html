<title>Hakuviestit</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Familjen+Grotesk:wght@500;600;700&family=Figtree:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
/* Asettelu: viestisovellus — yksi kapea sarake, pohjan välilehdet, kuplat ja päiväerottimet */
:root{
  --bg:#EEF2F0; --surface:#FFFFFF; --surface-2:#F6F8F7; --ink:#14201B; --muted:#5B6964;
  --line:#D8E0DC; --accent:#1D6B58; --accent-ink:#FFFFFF; --accent-soft:#D7ECE4;
  --bubble-out:#D7ECE4; --bubble-in:#FFFFFF;
  --ok:#2E7D4F; --warn:#B26A00; --bad:#B3261E; --info:#2F5DA8;
  --av1-bg:#D7ECE4; --av1-fg:#1D6B58; --av2-bg:#DCE6F7; --av2-fg:#2F5DA8; --av3-bg:#F6E3C4; --av3-fg:#8A5200;
  --av4-bg:#F2D9DD; --av4-fg:#9B2C3A; --av5-bg:#E5DDF3; --av5-fg:#5B3F9A; --av6-bg:#D5EBEF; --av6-fg:#1E6670;
  --font-display:"Familjen Grotesk", "Segoe UI", system-ui, sans-serif;
  --font-body:"Figtree", "Segoe UI", system-ui, sans-serif;
  --font-mono:"IBM Plex Mono", ui-monospace, Consolas, monospace;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#0E1412; --surface:#162019; --surface-2:#1B2621; --ink:#E4EDE9; --muted:#94A49E;
  --line:#26332E; --accent:#55BF9F; --accent-ink:#06120E; --accent-soft:#1E3A31;
  --bubble-out:#1E3A31; --bubble-in:#1B2621;
  --ok:#6BCB8F; --warn:#E3A84A; --bad:#F08A80; --info:#8AB0F0;
  --av1-bg:#1E3A31; --av1-fg:#8EDCC0; --av2-bg:#1D2B45; --av2-fg:#8AB0F0; --av3-bg:#3D2E12; --av3-fg:#E3A84A;
  --av4-bg:#43201F; --av4-fg:#F2A5AD; --av5-bg:#2C2442; --av5-fg:#C0A9EE; --av6-bg:#17363B; --av6-fg:#7CCBD8;
  color-scheme:dark; } }
:root[data-theme="dark"]{
  --bg:#0E1412; --surface:#162019; --surface-2:#1B2621; --ink:#E4EDE9; --muted:#94A49E;
  --line:#26332E; --accent:#55BF9F; --accent-ink:#06120E; --accent-soft:#1E3A31;
  --bubble-out:#1E3A31; --bubble-in:#1B2621;
  --ok:#6BCB8F; --warn:#E3A84A; --bad:#F08A80; --info:#8AB0F0;
  --av1-bg:#1E3A31; --av1-fg:#8EDCC0; --av2-bg:#1D2B45; --av2-fg:#8AB0F0; --av3-bg:#3D2E12; --av3-fg:#E3A84A;
  --av4-bg:#43201F; --av4-fg:#F2A5AD; --av5-bg:#2C2442; --av5-fg:#C0A9EE; --av6-bg:#17363B; --av6-fg:#7CCBD8;
  color-scheme:dark; }
body{ background:var(--bg); color:var(--ink); font-family:var(--font-body); }

*,*::before,*::after{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
html{-webkit-text-size-adjust:100%}
body{margin:0;font-size:16px;line-height:1.4;overflow-x:hidden;-webkit-tap-highlight-color:transparent;touch-action:manipulation;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;top:0;left:0;right:0;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:60}
html.noscroll,html.noscroll body{overflow:hidden}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;touch-action:manipulation}
h1,h2,h3,p{margin:0}
ul{list-style:none;margin:0;padding:0}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}
.mono{font-family:var(--font-mono);font-variant-numeric:tabular-nums}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

#app{
  --pl:max(16px,env(safe-area-inset-left,0px)); --pr:max(16px,env(safe-area-inset-right,0px));
  max-width:520px;margin:0 auto;min-height:100%;display:flex;flex-direction:column;position:relative;
  padding-left:max(16px, env(safe-area-inset-left, 0px));
  padding-right:max(16px, env(safe-area-inset-right, 0px));
  padding-bottom:calc(64px + env(safe-area-inset-bottom,0px));
}
#app.notabs{padding-bottom:0}
@media (min-width:560px){ #app{border-left:1px solid var(--line);border-right:1px solid var(--line)} }
#main{flex:1;display:flex;flex-direction:column;min-width:0}
.view{flex:1;display:flex;flex-direction:column;min-width:0}
.view.enter{animation:slidein .18s ease-out}
@keyframes slidein{from{opacity:0;transform:translateX(24px)}to{opacity:1;transform:none}}
@keyframes sheetin{from{transform:translateY(28px);opacity:.6}to{transform:none;opacity:1}}

.banner{margin:0 calc(-1*var(--pr)) 0 calc(-1*var(--pl));padding:6px var(--pr) 6px var(--pl);font-size:12px;text-align:center;color:var(--muted);background:var(--surface-2);border-bottom:1px solid var(--line)}

/* Ylätunniste */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);
  margin:0 calc(-1*var(--pr)) 0 calc(-1*var(--pl));padding:12px var(--pr) 8px var(--pl)}
.top h1{font:700 26px/1.15 var(--font-display);letter-spacing:-.01em}
.top-row{display:flex;align-items:center;gap:10px}
.top.chathead{border-bottom:1px solid var(--line);padding-top:8px;padding-bottom:8px}
.top.chathead .who{flex:1;min-width:0;text-align:left;background:none;border:0;padding:4px 0;min-height:44px;display:flex;flex-direction:column;justify-content:center}
.who-name{font:600 17px/1.2 var(--font-display);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.who-sub{font-size:13px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.icon-btn{width:44px;height:44px;min-width:44px;display:inline-flex;align-items:center;justify-content:center;background:none;border:0;border-radius:12px;color:var(--ink);padding:0}
.icon-btn:active{background:var(--surface-2)}
.search{position:relative;margin-top:10px}
.search svg{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--muted);pointer-events:none}
.search input{padding-left:40px}

/* Kontrollit */
input,select,textarea{font-size:16px;width:100%;min-height:44px;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--surface);color:var(--ink);-webkit-appearance:none;appearance:none}
select{background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),linear-gradient(135deg,var(--muted) 50%,transparent 50%);background-position:calc(100% - 18px) 50%,calc(100% - 13px) 50%;background-size:5px 5px,5px 5px;background-repeat:no-repeat;padding-right:32px}
textarea{resize:vertical;line-height:1.4}
input[type=checkbox]{width:22px;height:22px;min-height:22px;padding:0;-webkit-appearance:auto;appearance:auto;accent-color:var(--accent)}
input[type=file]{padding:8px}
.btn{min-height:44px;padding:0 16px;border-radius:12px;border:1px solid var(--line);background:var(--surface);color:var(--ink);font:600 15px var(--font-body);display:inline-flex;align-items:center;justify-content:center;gap:8px;text-align:center}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:transparent}
.btn.danger{color:var(--bad);border-color:color-mix(in srgb,var(--bad) 40%,var(--line))}
.btn.dangerfill{background:var(--bad);color:#fff;border-color:transparent}
.btn.block{width:100%}
.btn.ghost{background:none;border-color:transparent;color:var(--accent)}
.btn:disabled{opacity:.5;cursor:default}
.btn-row{display:flex;gap:10px;flex-wrap:wrap}
.btn-row .btn{flex:1 1 auto}
.field{display:flex;flex-direction:column;gap:6px;margin-bottom:14px}
.field>label,.lbl{font-size:13px;font-weight:600;color:var(--muted)}
.hint{font-size:13px;color:var(--muted)}
.err{font-size:14px;color:var(--bad);margin:6px 0}
.multi-row{display:flex;gap:8px;margin-bottom:8px}
.multi-row input{flex:1}

/* Sirut ja pillerit */
.chips{display:flex;gap:8px;overflow-x:auto;padding:10px 0 4px;scrollbar-width:none;overscroll-behavior-x:contain;margin-right:calc(-1*var(--pr))}
.chips::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;min-height:44px;padding:0 14px;border-radius:999px;border:1px solid var(--line);background:var(--surface);font:500 14px var(--font-body);color:var(--ink)}
.chip[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:transparent}
.pill{display:inline-block;font:500 11px/1 var(--font-body);padding:4px 8px;border-radius:999px;white-space:nowrap;color:var(--muted);background:color-mix(in srgb,var(--muted) 14%,transparent)}
.pill.s-haettu{color:var(--info);background:color-mix(in srgb,var(--info) 14%,transparent)}
.pill.s-haastattelu{color:var(--accent);background:color-mix(in srgb,var(--accent) 16%,transparent)}
.pill.s-tarjous{color:var(--ok);background:color-mix(in srgb,var(--ok) 16%,transparent)}
.pill.s-odottaa{color:var(--warn);background:color-mix(in srgb,var(--warn) 16%,transparent)}
.pill.s-hylatty{color:var(--bad);background:color-mix(in srgb,var(--bad) 14%,transparent)}
.tag{flex:0 0 auto;font-size:11px;font-weight:600;color:var(--muted);border:1px solid var(--line);border-radius:6px;padding:1px 5px;font-family:var(--font-body)}

/* Avatar */
.avatar{--sz:44px;width:var(--sz);height:var(--sz);min-width:var(--sz);border-radius:50%;display:inline-flex;align-items:center;justify-content:center;font:600 calc(var(--sz)*.36)/1 var(--font-display);letter-spacing:.02em;user-select:none}
.av0{background:var(--av1-bg);color:var(--av1-fg)} .av1{background:var(--av2-bg);color:var(--av2-fg)} .av2{background:var(--av3-bg);color:var(--av3-fg)}
.av3{background:var(--av4-bg);color:var(--av4-fg)} .av4{background:var(--av5-bg);color:var(--av5-fg)} .av5{background:var(--av6-bg);color:var(--av6-fg)}

/* Chat-lista */
.list{display:flex;flex-direction:column}
.row{display:flex;align-items:center;gap:12px;width:100%;min-height:72px;padding:10px 0;background:none;border:0;border-bottom:1px solid var(--line);text-align:left}
.row:active{background:var(--surface-2)}
.row-main{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.row-name{font:600 16px/1.25 var(--font-display);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row-name small{font:400 12px var(--font-body);color:var(--muted);margin-left:6px}
.row-prev{display:flex;align-items:center;gap:5px;font-size:14px;color:var(--muted);min-width:0}
.row-prev span.t{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.row-prev svg{flex:0 0 auto}
.row-warn{font-size:12px;font-weight:600;color:var(--warn)}
.row-side{display:flex;flex-direction:column;align-items:flex-end;gap:6px;flex:0 0 auto}
.row-date{font:400 12px var(--font-mono);color:var(--muted);font-variant-numeric:tabular-nums}
.unsorted-row{display:flex;align-items:center;gap:12px;width:100%;min-height:56px;margin:8px 0 0;padding:10px 14px;background:var(--accent-soft);color:var(--ink);border:1px solid var(--line);border-radius:12px;font-weight:600;text-align:left}
.unsorted-row span{flex:1}
.empty{margin:40px 0;text-align:center;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:14px}
.empty h2{font:600 20px var(--font-display);color:var(--ink)}
.empty p{max-width:34ch}
.fabwrap{position:fixed;left:0;right:0;bottom:calc(76px + env(safe-area-inset-bottom,0px));max-width:520px;margin:0 auto;display:flex;justify-content:flex-end;padding-right:max(16px,env(safe-area-inset-right,0px));pointer-events:none;z-index:25}
.fab{pointer-events:auto;width:56px;height:56px;border-radius:50%;border:0;background:var(--accent);color:var(--accent-ink);display:flex;align-items:center;justify-content:center;box-shadow:0 4px 14px rgba(0,0,0,.25)}

/* Välilehtipalkki */
#tabbar{position:fixed;bottom:0;left:0;right:0;max-width:520px;margin:0 auto;z-index:30;background:var(--surface);border-top:1px solid var(--line);
  display:grid;grid-template-columns:repeat(4,minmax(0,1fr));
  padding:0 max(8px,env(safe-area-inset-right,0px)) env(safe-area-inset-bottom,0px) max(8px,env(safe-area-inset-left,0px))}
.tab{min-width:0;min-height:56px;background:none;border:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;color:var(--muted);font:500 11.5px var(--font-body);padding:6px 2px;text-align:center}
.tab span{max-width:100%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-align:center}
.tab[aria-current="page"]{color:var(--accent)}
.tab[aria-current="page"] span{font-weight:700}

/* Chat */
.msgs{flex:1;display:flex;flex-direction:column;gap:6px;padding:8px 0 14px}
.day{align-self:center;font:500 12px var(--font-body);color:var(--muted);background:var(--surface-2);border:1px solid var(--line);padding:3px 10px;border-radius:999px;margin:10px 0 4px}
.bubble{max-width:88%;min-width:96px;padding:8px 10px 6px;border-radius:14px;border:1px solid transparent;position:relative;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
.bubble.out{align-self:flex-end;background:var(--bubble-out);border-bottom-right-radius:4px}
.bubble.in{align-self:flex-start;background:var(--bubble-in);border-color:var(--line);border-bottom-left-radius:4px}
.bmeta{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--muted);min-height:20px;margin-right:30px}
.bmeta .nm{font-weight:600;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:45%}
.bmeta .ad{font:400 11px var(--font-mono);word-break:break-all}
.bmore{position:absolute;top:-2px;right:-4px;width:44px;height:36px;display:flex;align-items:center;justify-content:center;background:none;border:0;color:var(--muted);padding:0}
.bsubj{font-weight:700;margin-top:2px;overflow-wrap:anywhere}
.bbody{white-space:pre-wrap;overflow-wrap:anywhere;font-size:15px;display:-webkit-box;-webkit-line-clamp:8;-webkit-box-orient:vertical;overflow:hidden;margin-top:2px}
.bbody.open{display:block;-webkit-line-clamp:unset}
.bexp{background:none;border:0;color:var(--accent);font:600 13px var(--font-body);min-height:44px;padding:0;margin:-4px 0 -8px;text-align:left}
.btime{font:400 11px var(--font-mono);color:var(--muted);text-align:right;margin-top:2px;font-variant-numeric:tabular-nums}
.composer{position:sticky;bottom:0;z-index:15;background:var(--bg);border-top:1px solid var(--line);
  margin:0 calc(-1*var(--pr)) 0 calc(-1*var(--pl));padding:6px var(--pr) calc(6px + env(safe-area-inset-bottom,0px)) var(--pl)}
.comp-tools{display:flex;align-items:center;justify-content:space-between;gap:2px;flex-wrap:wrap;margin-bottom:4px}
.comp-tools .small-btn{padding:0 4px;white-space:nowrap}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:12px;overflow:hidden;background:var(--surface)}
.seg button{min-height:32px;padding:0 8px;border:0;background:none;font:600 12.5px var(--font-body);color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.chbtns{display:inline-flex;gap:0}
.chbtn{width:34px;height:40px;border-radius:10px;border:1px solid transparent;background:none;color:var(--muted);display:flex;align-items:center;justify-content:center;padding:0}
.chbtn[aria-pressed="true"]{background:var(--accent-soft);color:var(--accent);border-color:var(--accent)}
.chbtn[aria-pressed="true"] svg{stroke-width:2.2}
.comp-more{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:8px}
.comp-more .full{grid-column:1/-1}
.comp-row{display:flex;gap:8px;align-items:flex-end}
.comp-row textarea{flex:1;min-height:44px;max-height:134px;resize:none;border-radius:20px;padding:10px 14px;overflow-y:auto}
.send{width:44px;height:44px;min-width:44px;border-radius:50%;border:0;background:var(--accent);color:var(--accent-ink);display:flex;align-items:center;justify-content:center;padding:0}
.send:disabled{opacity:.45}
.small-btn{min-height:40px;background:none;border:0;color:var(--accent);font:600 13px var(--font-body);padding:0 8px}

/* Kortit ja yhteenveto */
.sec{padding:14px 0 6px}
.sec>h2{font:700 18px var(--font-display);margin-bottom:8px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:12px}
.card h3{font:600 16px var(--font-display);margin-bottom:6px}
.card p{font-size:14px;color:var(--muted);margin-bottom:10px}
.stats3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin:6px 0 12px}
.stat{min-width:0;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 6px;text-align:center}
.stat b{display:block;font:600 24px var(--font-mono);font-variant-numeric:tabular-nums}
.stat span{display:block;font-size:12px;line-height:1.25;color:var(--muted);overflow-wrap:anywhere}
.chart{width:100%;height:auto;display:block}
.chart text{fill:var(--muted);font-family:var(--font-mono);font-size:10px}
.chart .bar{fill:var(--accent);cursor:pointer}
.chart .bar.sel{fill:var(--info)}
.chart .zero{stroke:var(--line);stroke-width:1}
.chart .axis{stroke:var(--line);stroke-width:1}
.chart-tip{min-height:22px;font-size:13px;color:var(--ink);text-align:center;margin-top:4px}
.sum-row{display:flex;align-items:center;gap:12px;width:100%;min-height:72px;padding:10px 0;border:0;border-bottom:1px solid var(--line);background:none;text-align:left}
.sum-row .l2{font-size:13px;color:var(--muted)}
.sum-row .nums{font:400 13px var(--font-mono);color:var(--muted);white-space:nowrap}
.sum-row .nums svg{vertical-align:-3px}
.prog{height:10px;border-radius:99px;background:var(--surface-2);border:1px solid var(--line);overflow:hidden;margin:10px 0 6px}
.prog>i{display:block;height:100%;width:0;background:var(--accent)}

/* Tuonti */
.grp{border:1px solid var(--line);border-radius:12px;padding:10px;margin-bottom:8px;background:var(--surface)}
.grp-h{display:flex;gap:10px;align-items:center;margin-bottom:8px}
.grp-h .nm{font-weight:600;overflow-wrap:anywhere}
.grp-h .ad{font:400 12px var(--font-mono);color:var(--muted);overflow-wrap:anywhere}
.grp-h .ct{font-size:12px;color:var(--muted)}
.known{font-size:12px;font-weight:600;color:var(--ok)}
.check{display:flex;align-items:center;gap:10px;min-height:44px}
.imp-bar{position:sticky;bottom:calc(56px + env(safe-area-inset-bottom,0px));background:var(--bg);padding:10px 0;z-index:12;border-top:1px solid var(--line)}

/* Omat tilit */
.id-row{display:flex;align-items:center;gap:10px;min-height:56px;padding:6px 0;border-bottom:1px solid var(--line)}
.id-row .v{flex:1;min-width:0;overflow-wrap:anywhere}
.id-row .v .mono{display:block;font-size:14px}
.id-row .v small{color:var(--muted);font-size:12px}

/* Sheetit */
.layer{position:fixed;inset:0;z-index:100;display:flex;align-items:flex-end;justify-content:center}
.scrim{position:absolute;inset:0;background:rgba(8,16,12,.55)}
.sheet{position:relative;width:100%;max-width:520px;max-height:92%;display:flex;flex-direction:column;background:var(--surface);border-radius:18px 18px 0 0;border:1px solid var(--line);border-bottom:0;animation:sheetin .18s ease-out;padding-bottom:env(safe-area-inset-bottom,0px)}
.sheet-h{display:flex;align-items:center;justify-content:space-between;padding:8px 8px 0 16px;gap:8px}
.sheet-t{font:700 18px var(--font-display);flex:1;min-width:0;overflow-wrap:anywhere}
.sheet-b{overflow-y:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch;padding:8px 16px 16px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.act{display:flex;align-items:center;gap:12px;width:100%;min-height:52px;background:none;border:0;border-bottom:1px solid var(--line);text-align:left;font:500 16px var(--font-body);padding:0 2px}
.act.bad{color:var(--bad)}
.act:last-child{border-bottom:0}
.quote{background:var(--surface-2);border:1px solid var(--line);border-radius:10px;padding:8px 10px;font-size:14px;color:var(--muted);margin-bottom:10px;max-height:6.5em;overflow:hidden;white-space:pre-wrap;overflow-wrap:anywhere}
.mem{border:1px solid var(--line);border-radius:12px;padding:10px;margin-bottom:8px}
.mem-h{display:flex;align-items:center;gap:6px}
.mem-h .nm{flex:1;font-weight:600}

// "mikko.laine@valio.fi" -> "Mikko Laine", "anna-liisa_virtanen+cv@x.fi" -> "Anna-Liisa Virtanen"
function nameFromAddress(addr) {
  const e = normEmail(addr);
  const at = e.indexOf('@');
  let local = at < 0 ? e : e.slice(0, at);
  local = local.split('+')[0].replace(/\d+$/, '');
  const parts = local.split(/[._]+/).filter(Boolean);
  if (!parts.length) return '';
  const cap = w => w.split('-').map(x => x ? x.charAt(0).toLocaleUpperCase('fi') + x.slice(1) : x).join('-');
  return parts.map(cap).join(' ');
}
function addrError(e) {
  if (!e.includes('@')) return 'Osoitteesta puuttuu @-merkki';
  const parts = e.split('@');
  if (parts.length !== 2) return 'Osoitteessa on useita @-merkkejä';
  if (!parts[0]) return 'Osoitteesta puuttuu osa ennen @-merkkiä';
  if (!parts[1]) return 'Osoitteesta puuttuu verkkotunnus @-merkin jälkeen';
  if (!parts[1].includes('.')) return 'Verkkotunnuksesta puuttuu pääte (esim. .fi)';
  if (!isEmail(e)) return 'Osoitteen muoto ei kelpaa';
  return '';
}
function mkAddrEntry(raw, name, email) {
  const e = normEmail(email);
  const err = addrError(e);

  if (err) return { raw: String(raw).trim(), email: e, ok: false, error: err };

}

// Palauttaa kaikki kohteet järjestyksessä: kelvolliset (ok:true, duplikaatit poistettu) ja virheelliset (ok:false, error).
function parseAddressList(text) {

    if (en.ok) {
      const prev = seen.get(en.email);
      if (prev) { if (!prev.nameGiven && en.nameGiven) { prev.name = en.name; prev.nameGiven = true; } return; }
      seen.set(en.email, en);

  };
  const lines = String(text || '').replace(/\r/g, '\n').split('\n')
    .map(l => l.replace(/^\s*(to|cc|bcc|from|vastaanottaja|kopio|piilokopio|lähettäjä)\s*:\s*/i, ''));
  for (const line of lines) {
    for (const piece0 of splitAddrList(line)) {
      const piece = piece0.replace(/^\s*(to|cc|bcc|from|vastaanottaja|kopio|piilokopio|lähettäjä)\s*:\s*/i, '');
      let rest = piece;
      if (piece.includes('<')) {
        rest = '';
        let last = 0, m;
        const re = /([^<>]*)<([^<>]*)>/g;
        while ((m = re.exec(piece))) {
          let before = m[1];

          if (before.includes('@') && !/"[^"]*@[^"]*"/.test(before)) {
            before = before.replace(/[^\s"<>,;]+@[^\s"<>,;]+/g, tok => { push(mkAddrEntry(tok, '', tok)); return ' '; });
          }
          push(mkAddrEntry(m[0], before.trim(), m[2]));
          last = re.lastIndex;
        }
        rest = piece.slice(last);
      }
      let pending = [];
      for (const tok of rest.split(/\s+/).filter(Boolean)) {
        const t = tok.replace(/^mailto:/i, '').replace(/^[("'<\[]+|[)"'>\],.;:]+$/g, '');
        if (t.includes('@')) { push(mkAddrEntry(tok, pending.join(' '), t)); pending = []; }
        else pending.push(tok.replace(/^["']+|["']+$/g, ''));
      }
      if (pending.length) out.push({ raw: pending.join(' '), email: '', ok: false, error: 'Ei sähköpostiosoite (puuttuu @-merkki)' });

}

function planEmailChats(entries, mode, chats, choices) {

  const rows = [], groups = new Map();
  const domainChat = en => {
    if (!en.company) return null;
    for (const id of Object.keys(chats)) {
      const c = chats[id];
      if (c.company && c.company.toLowerCase() === en.company.toLowerCase()) return id;
      if ((c.members || []).some(m => (m.emails || []).some(x => normEmail(x).endsWith('@' + en.domain)))) return id;
    }
    return null;
  };

    if (!en.ok) { rows.push({ entry: en, state: 'invalid' }); continue; }
    const kc = idx.get('e:' + en.email);
    if (kc) { rows.push({ entry: en, state: 'known', chatId: kc, chatName: chats[kc].name }); continue; }

    const choice = dc ? (choices[en.email] || 'addto') : 'new';
    const row = { entry: en, state: 'ok', domainChatId: dc, domainChatName: dc ? chats[dc].name : '', choice };
    rows.push(row);

    else { key = 'new:' + en.email; g = groups.get(key) || { kind: 'new', key, name: en.name, company: en.company, members: [] }; }
    g.members.push({ name: en.name, email: en.email });
    groups.set(key, g); row.groupKey = key; row.groupName = g.name;
  }
  const gl = [...groups.values()];
  return {
    rows, groups: gl,
    newChats: gl.filter(g => g.kind === 'new').length,
    added: gl.filter(g => g.kind === 'add').reduce((n, g) => n + g.members.length, 0),

    invalid: rows.filter(r => r.state === 'invalid').length

}

  const get = pp => pp.k === 'profile' ? M.profile : pp.k === 'crypto' ? M.crypto : pp.k === 'chat' ? M.chats[pp.cid] : pp.k === 'msg' ? (M.msgs[pp.cid] || {})[pp.mid] : pp.k === 'diag' ? M.diag[pp.mid] : M.unsorted[pp.mid];

    else if (v === undefined) delete M.unsorted[pp.mid]; else M.unsorted[pp.mid] = v;
  };
  const w = (fn, cb) => { const f = () => cb(fn()); watchers.add(f); setTimeout(f, 0); return () => watchers.delete(f); };
  const list = o => Object.keys(o || {}).map(id => Object.assign({ id }, o[id]));
  const putDoc = (path, data) => { const pp = parse(path); if (pp) { put(pp, data); dirty.set(path, data); } };
  if (loaded.M) { M = loaded.M; if (!('crypto' in M)) M.crypto = null; if (!M.diag) M.diag = {}; }
  else (loaded.docs || []).forEach(d => { const pp = parse(d.path); if (pp) put(pp, d.data); });
  const store = {
    mode: 'local', backend: backend.kind,
    // Esimerkkidata ladataan vain kerran, ja vasta salasanan asettamisen jälkeen (salattuna)
    isSeeded() { return seeded; },
    markSeeded() { seeded = true; persist(); },
    async getDoc(path) { const pp = parse(path); const v = pp && get(pp); return v ? clone(v) : null; },
    async rawList() {

      if (M.profile) out.push({ path: 'meta/profile', data: M.profile });
      Object.keys(M.chats).forEach(id => out.push({ path: 'chats/' + id, data: M.chats[id] }));
      Object.keys(M.msgs).forEach(cid => Object.keys(M.msgs[cid]).forEach(mid => out.push({ path: 'chats/' + cid + '/messages/' + mid, data: M.msgs[cid][mid] })));
      Object.keys(M.unsorted).forEach(id => out.push({ path: 'unsorted/' + id, data: M.unsorted[id] }));
      Object.keys(M.diag).forEach(id => out.push({ path: 'diag/' + id, data: M.diag[id] }));
      return out;
    },
    // "Unohdin salasanan": poistaa kaiken ja nollaa esimerkkilipun
    async wipe() {

      paths.forEach(p => dirty.set(p, undefined));
      seeded = false; emit(); persist();
    },
    watchProfile(cb) { return w(() => M.profile, cb); },
    watchChats(cb) { return w(() => Object.assign({}, M.chats), cb); },
    watchMessages(cid, cb) { return w(() => list(M.msgs[cid]), cb); },
    watchUnsorted(cb) { return w(() => list(M.unsorted), cb); },
    async listMessages(cid) { return list(M.msgs[cid]); },
    set(path, data) {

      putDoc(path, clone(data)); emit(); persist(); return Promise.resolve();
    },
    update(path, data) {

    },
    del(path) {
      const pp = parse(path); if (pp) { put(pp, undefined); dirty.set(path, undefined); } emit(); persist(); return Promise.resolve();
    }
  };
  return store;
}

/* ----- Virheet ja kirjoitusjono ----- */
function errText(e) {
  const c = e && e.code;
  if (c === 'quota_exceeded') return 'Tallennustila täynnä – poista vanhoja keskusteluja';
  if (c === 'resource_exhausted') return 'Liikaa pyyntöjä, yritä hetken päästä uudelleen';
  if (c === 'revoked') return 'Käyttöoikeus tähän sovellukseen päättyi. Lataa sivu uudelleen.';
  if (c === 'unavailable') return 'Tallennus ei onnistunut juuri nyt. Yritä uudelleen.';
  return 'Tallennus epäonnistui' + (e && e.message ? ' (' + e.message + ')' : '');
}
async function writeOp(op) {
  const st = S.store;
  for (let attempt = 0; ; attempt++) {
    try {
      if (op.fn) return await op.fn();
      if (op.t === 'set') return await st.set(op.path, op.data);
      if (op.t === 'update') return await st.update(op.path, op.data);
      if (op.t === 'del') return await st.del(op.path);
      return;
    } catch (e) {
      const c = e && e.code;
      if (attempt === 0 && (c === 'resource_exhausted' || c === 'unavailable')) { await sleep(1000 + Math.random() * 2000); continue; }
      throw e;
    }
  }
}
async function runWrites(ops, o) {
  o = o || {};
  let i = 0, done = o.offset || 0, error = null;
  async function worker() {
    while (i < ops.length && !error) {
      const op = ops[i++];
      try { await writeOp(op); } catch (e) { if (!error) error = e; return; }
      done++;
      if (o.onProgress) o.onProgress(done);
    }
  }
  await Promise.all(Array.from({ length: Math.min(o.concurrency || 3, ops.length) }, worker));
  return { done, error };
}
// Yksinkertainen kirjoitus: ilmoittaa virheestä, palauttaa true onnistuessa
async function doWrites(ops, title) {
  if (!ops.length) return true;
  let pg = null;
  if (ops.length > 3) pg = showProgress(title || 'Tallennetaan', ops.length);
  const r = await runWrites(ops, { onProgress: n => pg && pg.set(n) });
  if (pg) pg.close();
  if (r.error) { toast(errText(r.error), 'bad'); return false; }
  return true;
}
async function recomputeStats(cid, extra, removedIds) {
  const chat = S.chats[cid];
  if (!chat) return;
  const list = await S.store.listMessages(cid);
  const map = new Map(list.map(m => [m.id, m]));
  (extra || []).forEach(m => map.set(m.id, m));
  (removedIds || []).forEach(id => map.delete(id));
  const stats = computeStats([...map.values()]);
  if (list.length >= 1000 && chat.stats) { stats.sent = Math.max(stats.sent, chat.stats.sent || 0); stats.received = Math.max(stats.received, chat.stats.received || 0); }
  await S.store.update('chats/' + cid, { stats, updatedAt: nowIso() });
}
function statsOp(cid, extra, removed) { return { fn: () => recomputeStats(cid, extra, removed) }; }

// Luo pääsyavaimen ja PRF-salaisuuden, joka suojaa salasanan. Palauttaa {credId, prf, salt} tai heittää 'unsupported'
async function bioEnroll() {
  const salt = _rand(32);
  const cred = await navigator.credentials.create({ publicKey: {
    rp: { name: 'Hakuviestit', id: location.hostname },
    user: { id: _rand(16), name: 'hakuviestit', displayName: 'Hakuviestit' },
    challenge: _rand(32),
    pubKeyCredParams: [{ type: 'public-key', alg: -7 }, { type: 'public-key', alg: -257 }],
    authenticatorSelection: { authenticatorAttachment: 'platform', userVerification: 'required', residentKey: 'preferred' },
    extensions: { prf: { eval: { first: salt } } }
  } });
  if (!cred || !cred.rawId) throw new Error('unsupported');
  const credId = b64e(new Uint8Array(cred.rawId));
  const ext = cred.getClientExtensionResults ? cred.getClientExtensionResults() : {};
  let first = ext && ext.prf && ext.prf.results && ext.prf.results.first;
  if (!first) {                                           // iOS palauttaa PRF-tuloksen vasta get-kutsulla
    const got = await navigator.credentials.get({ publicKey: {
      challenge: _rand(32), rpId: location.hostname, allowCredentials: [{ type: 'public-key', id: b64d(credId) }],
      userVerification: 'required', timeout: 60000, extensions: { prf: { eval: { first: salt } } }
    } });
    const e2 = got && got.getClientExtensionResults ? got.getClientExtensionResults() : {};
    first = e2 && e2.prf && e2.prf.results && e2.prf.results.first;
  }
  if (!first) throw new Error('unsupported');
  return { credId, salt: b64e(salt), prf: u8of(first) };
}

// Salaa kaiken uudelleen uudella avaimella; meta/crypto vaihtuu viimeisenä (next-kenttä suojaa keskeytykseltä)
async function changePassword(oldKey, newPw) {
  const pg = showProgress('Salataan uudelleen', 1);
  try {
    const { key: newKey, meta: newMeta } = await createCrypto(newPw);
    if (SEC.meta && SEC.meta.lm) newMeta.lm = SEC.meta.lm;      // säilytä oletuslukitus
    const hadBio = !!(SEC.meta && SEC.meta.bio);                 // vanha salasana ei enää kelpaa: biometrinen avaus poistuu
    const raws = (await SEC.inner.rawList()).filter(d => docKind(d.path) && d.path !== 'meta/crypto');
    pg.setTotal(raws.length + 1);
    await SEC.inner.set('meta/crypto', Object.assign({}, SEC.meta, { next: { kdf: newMeta.kdf, iter: newMeta.iter, salt: newMeta.salt, check: newMeta.check } }));
    const ops = raws.map(d => ({ fn: async () => {
      let plain = null;
      try { plain = await decDoc(oldKey, d.path, d.data); } catch (e) { plain = null; }
      if (plain === null) {                                            // jo uudella avaimella tai korruptoitunut
        try { await decDoc(newKey, d.path, d.data); return; } catch (e) { return; }
      }
      const enc = await encDoc(newKey, d.path, plain);
      const verify = await decDoc(newKey, d.path, enc);
      if (stable(verify) !== stable(plain)) throw { code: 'integrity', message: 'tarkistus epäonnistui' };
      await SEC.inner.set(d.path, enc);
    } }));
    const r = await runWrites(ops, { onProgress: n => pg.set(n, 'Salataan uudelleen') });
    if (r.error) throw r.error;
    await SEC.inner.set('meta/crypto', newMeta);
    if (hadBio) await nativeBioClear();                          // natiivi: vanha salasana pois Keychainista
    // vaihda käyttöön uusi avain ja käynnistä tilaukset uudelleen
    const reopen = S.openId;
    stopData(); SEC.wstore.close();
    SEC.key = newKey; SEC.meta = newMeta; SEC.metaRaw = newMeta;
    SEC.wstore = makeCryptoStore(SEC.inner, newKey); S.store = SEC.wstore;
    startData();
    if (reopen) setTimeout(() => { if (S.chats[reopen]) openChat(reopen); }, 100);
    pg.close(); renderPrivacy(); toast('Salasana vaihdettu');
    if (hadBio) setTimeout(() => toast(BS().resetHint), 2700);
  } catch (e) { pg.close(); toast('Salasanan vaihto epäonnistui: ' + errText(e) + ' Yritä uudelleen samoilla salasanoilla.', 'bad'); }
}

// Luo keskustelut ja lisää henkilöt; siirtää lopuksi lajittelemattomista osuvat viestit
// Luo chatit ja lisää jäsenet ryhmistä ({kind:'new'|'add', name, company, members:[{name,email}], chatId?}).
// Palauttaa {ok, created, touched} (touched = kaikki käsitellyt chat-id:t). Ei toasteja eikä lajittelemattomien siirtoa.
async function applyEmailGroups(groups, statusVal, title) {
  const now = nowIso(), ops = [], created = [], touched = [];
  for (const g of groups) {
    if (g.kind === 'new') {
      const id = newChatId(), nm = g.name || (g.members[0] && g.members[0].name) || 'Keskustelu';
      const data = {
        name: nm, company: g.company || '', status: statusVal, notes: '', color: 'av' + (fnv32(nm) % 6 + 1),
        members: g.members.map(m => ({ id: uid(), name: m.name, role: '', emails: [m.email], phones: [] })),
        createdAt: now, updatedAt: now, stats: computeStats([])
      };
      ops.push({ t: 'set', path: 'chats/' + id, data });
      created.push({ id, data }); touched.push(id);
    } else {
      const chat = S.chats[g.chatId]; if (!chat) continue;
      const members = clone(chat.members || []);
      g.members.forEach(m => ensureMember(members, { name: m.name, email: m.email, phone: '' }, uid));
      ops.push({ t: 'update', path: 'chats/' + g.chatId, data: { members, updatedAt: now } });
      S.chats = Object.assign({}, S.chats, { [g.chatId]: Object.assign({}, chat, { members }) });
      touched.push(g.chatId);
    }
  }
  if (!ops.length) return { ok: false, created, touched };
  if (!await doWrites(ops, title || 'Lisätään keskusteluja')) return { ok: false, created, touched };
  created.forEach(c => { S.chats = Object.assign({}, S.chats, { [c.id]: c.data }); });
  rebuildIndexes(); renderChatList();
  return { ok: true, created, touched };
}
async function runEmailAdd(plan, statusVal) {
  const r = await applyEmailGroups(plan.groups, statusVal);
  if (!r.ok) return false;
  // Haetaan lajittelemattomista näille osoitteille kuuluvat viestit
  let moved = 0;
  for (const cid of r.touched) {
    const ms = unsortedMatches(cid);
    if (ms.length && await moveUnsortedTo(ms, cid)) moved += ms.length;
  }
  const nNew = r.created.length;
  toast('Lisättiin ' + nNew + (nNew === 1 ? ' keskustelu' : ' keskustelua') + (plan.added ? ' ja ' + plan.added + (plan.added === 1 ? ' henkilö' : ' henkilöä') : '') + ', siirrettiin ' + moved + (moved === 1 ? ' viesti' : ' viestiä'));
  return true;
}

const gmailAvailable = () => !!S.mcp && !S.locked && (S.mcp.rest ? gmailRestReady() : !STANDALONE);
const gmailIsRest = () => !!(S.mcp && S.mcp.rest);
const chatEmails = chat => [...new Set(((chat && chat.members) || []).flatMap(m => m.emails || []).map(normEmail).filter(isEmail))];
const myEmailSet = () => new Set(((S.profile && S.profile.identities) || []).filter(i => i.type === 'email').map(i => normEmail(i.value)));
const myEmail = () => { const i = ((S.profile && S.profile.identities) || []).find(x => x.type === 'email'); return i ? normEmail(i.value) : ''; };

async function gmailCall(tool, input) {
  const res = await S.mcp.callTool('Gmail', tool, input, { cache: false });
  return (res && res.payload) || {};
}
// Lukukutsu: yksi uudelleenyritys vain jos err.retryable
async function gmailRead(tool, input, ctl) {
  try { return await gmailCall(tool, input); }
  catch (e) {
    if (e && e.retryable && !(ctl && ctl.cancelled)) { await sleep(e.retryAfterMs || 1000 + Math.random() * 1000); return gmailCall(tool, input); }
    throw e;
  }
}
async function getPerms() {
  if (S.perm) return S.perm;
  const p = window.claude && window.claude.use ? await window.claude.use('permissions') : null;
  if (p) S.perm = p;
  return p;
}
// Kehittäjän diagnostiikka: selväkielinen diag/send (+ diag/send-<yritys>); ei koskaan viestin sisältöä, aihetta tai osoitteita. Virheet nielaistaan hiljaa.
function writeSendDiag(attempt, tool, err, secrets) {
  try {
    const doc = buildSendDiag({ attempt, tool, err, at: nowIso(), ua: bioUA(), standalone: STANDALONE, secrets });
    const st = SEC.inner; if (!st) return;
    ['diag/send', 'diag/send-' + attempt].forEach(p => { try { Promise.resolve(st.set(p, doc)).catch(() => { /* diag ei saa häiritä */ }); } catch (e) { /* ok */ } });
  } catch (e) { /* diag ei saa häiritä */ }
}
// Ensimmäinen suora lähetys sivun latauksen jälkeen: tarkista Gmail-lupa ja pyydä se tarvittaessa (kutsutaan napautuksen käsittelijästä). 'ok' | 'denied'
async function ensureGmailPerm() {
  if (GM.permOk) return 'ok';
  let p = null; try { p = await getPerms(); } catch (e) { p = null; }
  if (!p || typeof p.state !== 'function') return 'ok';
  const st = async () => { const v = await p.state('mcp:Gmail'); return typeof v === 'string' ? v : String((v && v.state) || ''); };
  try {
    let v = await st();
    if (v === 'prompt' && typeof p.request === 'function') {
      let r = null; try { r = await p.request(['mcp:Gmail']); } catch (e) { r = null; }
      try { v = await st(); } catch (e) { v = /denied/.test(JSON.stringify(r) || '') ? 'denied' : v; }
    }
    if (v === 'denied') return 'denied';
  } catch (e) { return 'ok'; }
  GM.permOk = true; return 'ok';
}

  const info = gmailErrorInfo(err);

    row.append(h('button', { class: 'btn primary', type: 'button', id: 'gm-reauth', text: 'Kirjaudu Googleen', onclick: () => gmailConnect('') }));
  }
  if (info.openPerms) {
    row.append(h('button', { class: 'btn', type: 'button', id: 'gm-perms', text: 'Avaa luvat', onclick: async () => {

function openSyncSheet(title) {
  const ctl = { cancelled: false };
  let bar, lbl;
  const sh = openSheet(title, body => {
    bar = h('i', { id: 'gs-bar' }); lbl = h('p', { class: 'hint', id: 'gs-label', 'aria-live': 'polite', text: 'Haetaan…' });
    body.append(h('div', { class: 'prog' }, bar), lbl,
      h('button', { class: 'btn block', type: 'button', id: 'gs-cancel', text: 'Peruuta', onclick: () => { ctl.cancelled = true; lbl.textContent = 'Keskeytetään…'; } }));
  }, { persistent: true });
  ctl.set = (done, total, text) => { bar.style.width = total ? Math.min(100, Math.round(100 * done / total)) + '%' : '0%'; if (text) lbl.textContent = text; };
  ctl.close = () => sh.close();
  return ctl;
}
async function gmailSyncChat(cid, ctl, prefix) {
  const chat = S.chats[cid];
  const q = gmailQueryForChat(chat);
  if (!q) return { added: 0, threads: 0 };
  const pre = prefix ? prefix + ': ' : '';
  const ids = []; let token;
  for (let page = 0; page < 3 && !ctl.cancelled; page++) {
    ctl.set(0, 0, pre + 'Haetaan ketjuja…');
    const res = await gmailRead('search_threads', Object.assign({ query: q, pageSize: 20, view: 'THREAD_VIEW_IDS_ONLY' }, token ? { pageToken: token } : {}), ctl);
    (res.threads || []).forEach(t => { if (t && t.id && !ids.includes(t.id) && ids.length < 60) ids.push(t.id); });
    token = res.nextPageToken;
    if (!token || ids.length >= 60) break;
  }
  const have = new Set((await S.store.listMessages(cid)).map(m => m.id));
  const mine = myEmailSet();
  const newDocs = []; let done = 0;
  for (let i = 0; i < ids.length && !ctl.cancelled; i++) {
    ctl.set(i, ids.length, pre + 'Haetaan… ' + i + '/' + ids.length + ' ketjua');
    const th = await gmailRead('get_thread', { threadId: ids[i], messageFormat: 'PLAIN_TEXT' }, ctl);
    const ops = [];
    for (const gm of (th.messages || [])) {
      const am = gmailMsgToAppMsg(gm, mine);
      if (!am || have.has(am.id)) continue;
      have.add(am.id);
      const doc = toMsgDoc(am);
      ops.push({ t: 'set', path: 'chats/' + cid + '/messages/' + am.id, data: doc });
      newDocs.push(Object.assign({ id: am.id }, doc));
    }
    if (ops.length) { const r = await runWrites(ops, {}); if (r.error) throw r.error; }
    done = i + 1;
  }
  ctl.set(done, ids.length, pre + 'Valmis ' + done + '/' + ids.length + ' ketjua');
  // Sähköpostiin avatut (pending) viestit: korvataan Gmailista haetulla oikealla kopiolla
  let removed = [];
  try {
    const all = await S.store.listMessages(cid);
    const pend = all.filter(m => m.pending), outs = all.filter(m => m.source === 'gmail' && m.dir === 'out');
    const used = new Set();
    for (const p of pend) {
      const hit = matchPending(p, outs.filter(m => !used.has(m.id)));
      if (hit) { used.add(hit.id); removed.push(p.id); }
    }
    if (removed.length) { const r = await runWrites(removed.map(id => ({ t: 'del', path: 'chats/' + cid + '/messages/' + id })), {}); if (r.error) { removed = []; throw r.error; } }
  } catch (re) { /* täsmäytys on parhaan yrityksen varassa */ }
  if (newDocs.length || removed.length) await recomputeStats(cid, newDocs, removed);
  if (!ctl.cancelled) await S.store.update('chats/' + cid, { gmail: { lastSyncAt: nowIso() } });
  return { added: newDocs.length, threads: ids.length };
}
const syncToast = (added, cancelled) => toast((cancelled ? 'Haku keskeytettiin: ' : '') + '+' + added + (added === 1 ? ' uusi viesti' : ' uutta viestiä'));
async function gmailSyncOne(cid) {
  if (GM.busy || !gmailAvailable() || !S.chats[cid]) return;
  GM.busy = true;
  const ctl = openSyncSheet('Haetaan Gmailista');
  try {
    const r = await gmailSyncChat(cid, ctl);
    ctl.close(); syncToast(r.added, ctl.cancelled); S.sum.sig = '';
  } catch (e) {
    ctl.close();
    showGmailErrorSheet(e, () => gmailSyncOne(cid));
  } finally { GM.busy = false; }
}
async function gmailSyncAll() {
  if (GM.busy || !gmailAvailable()) return;
  const ids = chatList().filter(c => chatEmails(c).length).sort((a, b) => chatSortKey(b) - chatSortKey(a)).map(c => c.id);
  if (!ids.length) { toast('Ei keskusteluja, joilla on sähköpostiosoite.'); return; }
  GM.busy = true;
  const ctl = openSyncSheet('Haetaan Gmailista');
  let added = 0;
  try {
    for (let i = 0; i < ids.length && !ctl.cancelled; i++) {
      const r = await gmailSyncChat(ids[i], ctl, 'Keskustelu ' + (i + 1) + '/' + ids.length);
      added += r.added;
    }
    ctl.close(); syncToast(added, ctl.cancelled); S.sum.sig = '';
  } catch (e) {
    ctl.close();
    if (added) syncToast(added, true);
    showGmailErrorSheet(e, () => gmailSyncAll());
  } finally { GM.busy = false; }
}

/* ----- Lähetys ----- */
const gmailLatest = () => { const a = S.messages.filter(m => m.source === 'gmail' && m.gmail && m.gmail.messageId); return a.length ? a[a.length - 1] : null; };
const gmailLatestIncoming = () => { const a = S.messages.filter(m => m.dir === 'in' && m.source === 'gmail' && m.gmail && m.gmail.messageId); return a.length ? a[a.length - 1] : null; };
function gmailComposeSend(o) {
  const chat = S.chats[o.cid]; if (!chat) return;
  const latest = gmailLatest(), inc = gmailLatestIncoming();
  const emails = chatEmails(chat);
  const opts = emails.slice();
  if (inc && inc.from && isEmail(inc.from) && !opts.includes(inc.from)) opts.unshift(inc.from);
  const defTo = inc && opts.includes(inc.from) ? inc.from : opts[0];
  const direct = !!settings().gmailDirect && gmailAvailable() && !gmailIsRest();
  openSheet('Kirjoita sähköposti', (body, api) => {
    const toSel = h('select', { id: 'gc-to', 'aria-label': 'Vastaanottaja' }, opts.map(e => h('option', { value: e, text: e, selected: e === defTo })));
    const subj = h('input', { id: 'gc-subject', type: 'text', autocomplete: 'off', value: latest ? replySubject(latest.subject) : (o.subject || ''), disabled: !!latest && direct, placeholder: 'Aihe' });
    const errWrap = h('div', { id: 'gc-errwrap' });
    const sendBtn = h('button', { class: 'btn block', type: 'button', id: 'gc-send', text: 'Lähetä Gmailin kautta' });
    const cancelBtn = h('button', { class: 'btn', type: 'button', id: 'gc-cancel', text: 'Peruuta', onclick: () => api.close() });
    let sending = false;
    const doSend = async () => {
      if (sending) return;
      const to = toSel.value, subject = subj.value.trim();
      errWrap.replaceChildren();
      if (!latest && !subject) { errWrap.append(h('p', { class: 'err', text: 'Anna sähköpostille aihe.' })); subj.focus(); return; }
      sending = true; sendBtn.hidden = false; sendBtn.disabled = true; sendBtn.textContent = 'Lähetetään…';
      const startedAt = Date.now();
      const finishSent = async payload => {
        const mid = payload && payload.id;
        const id = mid ? gmailDocId(mid) : 'gm-' + hash64(o.cid + '|' + Date.now() + '|' + o.body.slice(0, 50));
        const doc = toMsgDoc({
          at: nowIso(), dir: 'out', channel: 'email', from: myEmail(), fromName: 'Sinä', to: [to], subject: latest ? (subject || replySubject(latest.subject)) : subject,
          body: o.body, source: 'gmail', gmail: mid ? { messageId: mid, threadId: payload.threadId || '' } : null
        });
        api.close();
        try {
          await S.store.set('chats/' + o.cid + '/messages/' + id, doc);
          await recomputeStats(o.cid, [Object.assign({ id }, doc)], []);
        } catch (se) { toast('Sähköposti lähetettiin, mutta viestin tallennus epäonnistui. Hae viestit Gmailista.', 'bad'); }
        if (o.onSent) o.onSent();
        toast('Sähköposti lähetetty');
      };
      const secrets = () => [o.body, subj.value.trim()];
      const codeHint = code => h('p', { class: 'hint', id: 'gc-code', text: 'Virhekoodi: ' + (code || 'tuntematon') });
      // Koko syy näkyviin (sähköpostiosoitteet piilotettu, enintään 200 merkkiä)
      const msgHint = err => { const m = redactDiag(err && err.message, 200, secrets()); return m ? h('p', { class: 'hint', id: 'gc-msg', text: m }) : null; };
      const hints = (code, err) => [codeHint(code), msgHint(err)].filter(Boolean);
      const redErr = err => Object.assign({}, err, { message: redactDiag(err && err.message, 200, secrets()) });   // osoitteet piiloon myös virhelaatikossa
      const mailtoBtn = () => h('a', { class: 'btn', id: 'gc-mailto', style: 'text-decoration:none', href: mailtoHref(to, subject, o.body), target: '_blank', rel: 'noopener', text: 'Avaa sähköpostisovelluksessa',
        onclick: () => { toast('Kun viesti on lähetetty, se tulee tähän chattiin seuraavassa Gmail-haussa.'); api.close(); } });
      const showNotSent = async (code, err) => {
        const reason = (code === 'upstream_error' || code === 'approval_required')
          ? 'Gmail ei saanut lähetyslupaa. Puhelimen Claude-sovellus ei aina pysty kysymään lupaa – salli lähetys Luvat-valikosta tai kokeile claude.ai-sivulla selaimessa.'
          : code === 'perm_denied' ? 'Gmailin lähetyslupa on estetty. Avaa Luvat ja salli lähetys.'
            : code === 'server_unavailable' ? 'Gmail ei vastannut ajoissa.' : code === 'cancelled' ? 'Lähetys keskeytyi.' : '';
        let perms = null; try { perms = await getPerms(); } catch (pe) { perms = null; }
        const row = h('div', { class: 'btn-row' }, h('button', { class: 'btn primary', type: 'button', id: 'gc-retry', text: 'Yritä uudelleen', onclick: () => { doSend(); } }));
        if (perms && perms.manage) row.append(h('button', { class: 'btn', type: 'button', id: 'gc-perms', text: 'Luvat', onclick: async () => {
          try { await perms.manage(); } catch (me) { toast('Avaa artefaktin ⋮-valikosta Luvat.'); }
        } }));
        row.append(mailtoBtn());
        const box = h('div', { class: 'gm-err', id: 'gm-err', role: 'alert' }, h('p', { id: 'gm-err-text', text: 'Viestiä ei lähetetty.' }));
        if (reason) box.append(h('p', { id: 'gm-err-reason', text: reason }));
        box.append(row);
        errWrap.replaceChildren(box, ...hints(code, err));
        sendBtn.hidden = true;
      };
      const resetBtn = () => { sendBtn.disabled = false; sendBtn.textContent = 'Lähetä Gmailin kautta'; };
      // Lähetyksen varmistus Lähetetyistä: {threads, hit}; threads === null jos haku epäonnistui
      const verify = async () => {
        let threads = null, hit = null;
        // Gmailin haku voi näyttää juuri lähetetyn viestin viiveellä: tarkistetaan muutaman kerran ennen kuin sanotaan "ei lähetetty"
        for (const wait of (window.HV_SENT_CHECK_DELAYS || [1500, 3000, 4500])) {
          await new Promise(r => setTimeout(r, wait));
          try { const r = await gmailCall('search_threads', { query: 'in:sent to:' + to + ' newer_than:1d', pageSize: 10, view: 'THREAD_VIEW_MINIMAL' }); threads = r.threads || []; }
          catch (re) { writeSendDiag('verify', 'search_threads', re, secrets()); if (!threads) threads = null; break; }
          hit = findSentMatch(threads, { to, subject, body: o.body, sinceMs: startedAt });
          if (hit) break;
        }
        return { threads, hit };
      };
      const perm = await ensureGmailPerm();
      if (perm === 'denied') { resetBtn(); sending = false; await showNotSent('perm_denied'); return; }
      let attempt = latest ? 'reply' : 'send_message', fellBack = false;
      let err = null;
      try {
        const payload = latest
          ? await gmailCall('reply', { messageId: latest.gmail.messageId, body: o.body, to: [to] })
          : await gmailCall('send_message', { to: [to], subject, body: o.body });
        await finishSent(payload);
        return;
      } catch (e) { err = e; }
      for (;;) {
        const e = err, code = String((e && e.code) || '');
        writeSendDiag(attempt, attempt, e, secrets());
        resetBtn();
        if (code === 'approval_required') { sending = false; await showNotSent(code, e); return; }
        const canFallback = !fellBack && !!latest && attempt === 'reply' && ['tool_error', 'bad_request', 'upstream_error'].includes(code);
        if (NOT_SENT_DEFINITE.includes(code) && !canFallback) {
          errWrap.append(gmailErrorBox(redErr(e), () => { sending = false; doSend(); }), ...hints(code, e));
          sending = false; return;
        }
        // Epävarma tulos (tai varalähetyksen ehto): varmista Lähetetyistä
        errWrap.replaceChildren(h('p', { class: 'hint', id: 'gc-status', role: 'status', text: 'Tarkistetaan, lähtikö viesti…' }));
        sendBtn.disabled = true; sendBtn.textContent = 'Tarkistetaan…';
        const { threads, hit } = await verify();
        resetBtn();
        if (!threads) {
          sending = false;
          if (NOT_SENT_DEFINITE.includes(code)) { errWrap.replaceChildren(gmailErrorBox(redErr(e), () => { sending = false; doSend(); }), ...hints(code, e)); return; }
          errWrap.replaceChildren(h('div', { class: 'gm-err', id: 'gm-err', role: 'alert' }, h('p', { id: 'gm-err-text', text: SEND_UNCERTAIN_TEXT }), h('div', { class: 'btn-row' }, mailtoBtn())), ...hints(code, e));
          sendBtn.textContent = 'Lähetä uudelleen';
          return;
        }
        if (hit) { await finishSent(hit); return; }
        if (!canFallback) { sending = false; await showNotSent(code, e); return; }
        // Varalähetys: reply hylättiin eikä viestiä löytynyt Lähetetyistä -> ei kaksoislähetyksen riskiä. Yritetään kerran uutena viestinä samaan ketjuun.
        fellBack = true; attempt = 'send_message';
        sendBtn.disabled = true; sendBtn.textContent = 'Lähetetään…';
        try {
          const payload = await gmailCall('send_message', { to: [to], subject: subject || replySubject(latest.subject), body: o.body, replyThreadId: latest.gmail.threadId });
          await finishSent(payload);
          return;
        } catch (e2) { err = e2; }
      }
    };
    sendBtn.onclick = doSend;
    // Oletus: avaa valmiiksi kirjoitettu sähköposti käyttäjän omaan sähköpostisovellukseen (ei Gmail-kirjoituslupaa)
    const bodyTa = h('textarea', { id: 'gc-body', readonly: true, rows: '6', 'aria-label': 'Viesti' });
    bodyTa.value = o.body;
    const openA = h('a', { class: 'btn primary block', id: 'gc-open', style: 'text-decoration:none', href: '#', target: '_blank', rel: 'noopener', text: 'Avaa sähköpostisovelluksessa', onclick: () => opened() });
    const webA = h('a', { class: 'btn block', id: 'gc-gmailweb', style: 'text-decoration:none', href: '#', target: '_blank', rel: 'noopener', text: 'Avaa Gmailissa (selain)', onclick: () => opened() });
    const upd = () => {
      openA.setAttribute('href', mailtoHref(toSel.value, subj.value.trim(), o.body));
      webA.setAttribute('href', gmailComposeUrl(toSel.value, subj.value.trim(), o.body));
    };
    ['input', 'change'].forEach(t => { toSel.addEventListener(t, upd); subj.addEventListener(t, upd); });
    upd();
    const copyBtn = h('button', { class: 'btn block', type: 'button', id: 'gc-copy', text: 'Kopioi teksti', onclick: async () => {
      try {
        if (!(navigator.clipboard && navigator.clipboard.writeText)) throw new Error('ei');
        await navigator.clipboard.writeText(o.body); toast('Teksti kopioitu');
      } catch (ce) { try { bodyTa.focus(); bodyTa.select(); } catch (se) { /* ei valintaa */ } toast('Kopioi teksti käsin'); }
    } });
    let saved = false;
    const opened = () => {
      upd();
      if (saved) return;
      saved = true;
      const to = toSel.value, subject = subj.value.trim();
      const doc = toMsgDoc({ at: nowIso(), dir: 'out', channel: 'email', from: myEmail(), fromName: 'Sinä', to: [to], subject, body: o.body, source: 'manual', pending: true });
      const id = 'm' + hash64([o.cid, doc.at, subject, o.body.slice(0, 200), uid()].join('|'));
      toast('Viesti avattiin sähköpostiin. Muista painaa siellä Lähetä.');
      setTimeout(() => api.close(), 150);
      (async () => {
        if (!await doWrites([{ t: 'set', path: 'chats/' + o.cid + '/messages/' + id, data: doc }])) return;
        await doWrites([statsOp(o.cid, [Object.assign({ id }, doc)], [])]);
        if (o.onSent) o.onSent();
      })();
    };
    body.append(...[
      direct ? h('div', { class: 'field' }, h('span', { class: 'lbl', text: 'Lähettäjä (Gmail-tilisi)' }), h('div', { id: 'gc-from', class: 'mono', style: 'font-size:14px;overflow-wrap:anywhere', text: myEmail() || 'Gmailissa käytössä oleva tili' })) : null,
      field('gc-to', 'Vastaanottaja', toSel),
      field('gc-subject', 'Aihe', subj, latest && direct ? 'Vastaus jatkaa samaa ketjua, joten aihetta ei voi muuttaa.' : null),
      field('gc-body', 'Viesti', bodyTa),
      openA,
      h('p', { class: 'hint', id: 'gc-hint', style: 'margin:6px 0 10px', text: 'Sähköposti avautuu valmiiksi kirjoitettuna. Lähetä se sieltä – sovellus ei lähetä mitään itse.' }),
      h('div', { class: 'btn-row', style: 'flex-direction:column' }, webA, copyBtn, direct ? sendBtn : null),
      errWrap, h('div', { class: 'btn-row', style: 'margin-top:8px' }, cancelBtn)].filter(Boolean));
  });
}

async function startDiscovery(period, entered) {
  if (DISC.busy || GM.busy || !gmailAvailable()) return;
  DISC.busy = GM.busy = true;
  const ctl = openSyncSheet('Etsitään työpaikkakeskusteluja');
  let handedOff = false;
  const stop = msg => { ctl.close(); if (msg) toast(msg); };
  try {
    // 1. Tilin tarkistus
    ctl.set(0, 0, 'Tarkistetaan Gmail-tiliä…');
    const accRes = await gmailRead('search_threads', { query: 'in:sent', pageSize: 1, view: 'THREAD_VIEW_METADATA_ONLY' }, ctl);
    if (ctl.cancelled) return stop('Haku keskeytettiin');
    const acc = connectedAccountFromThreads(accRes.threads);
    const want = normEmail(entered || myEmail() || '');
    if (acc && !myEmailSet().has(acc)) {
      if (want && acc !== want) {
        const go = await confirmSheet({ title: 'Gmail-tili', ok: 'Jatka tällä tilillä', text: (gmailIsRest() ? 'Olet kirjautunut Googleen tilillä ' : 'Gmail-yhdistäjä on kirjautunut tilille ') + acc + '. Voit hakea vain sen tilin postit.' });
        if (!go) return stop();
      }
      const ids = ((S.profile && S.profile.identities) || []).slice();
      if (!ids.some(i => i.type === 'email' && normEmail(i.value) === acc)) await saveIdentities(ids.concat([{ type: 'email', value: acc, label: 'Gmail' }]), { noPrompt: true });
    }
    const own = new Set([...myEmailSet(), ...(acc ? [acc] : [])]);
    // 2. Metadatahaku (A: omat keskustelut, B: työnantajien viestit joihin et vastannut)
    const q = discoveryQueries(period), threads = new Map();
    for (const key of ['A', 'B']) {
      let token;
      for (let page = 0; page < 4 && !ctl.cancelled; page++) {
        ctl.set(0, 0, 'Etsitään… ' + threads.size + ' ketjua');
        const res = await gmailRead('search_threads', Object.assign({ query: q[key], pageSize: 50, view: 'THREAD_VIEW_MINIMAL' }, token ? { pageToken: token } : {}), ctl);
        (res.threads || []).forEach(t => { if (t && t.id && !threads.has(t.id)) threads.set(t.id, t); });
        token = res.nextPageToken;
        if (!token) break;
      }
    }
    if (ctl.cancelled) return stop('Haku keskeytettiin');
    ctl.set(0, 0, 'Ryhmitellään… ' + threads.size + ' ketjua');
    const groups = discoverCounterparts([...threads.values()], own);
    // 3. Luokittelu
    const cls = await classifyGroups(groups);
    ctl.close(); handedOff = true;
    if (!groups.length) { toast('Gmailista ei löytynyt keskusteluja valitulta ajalta.'); return; }
    openDiscoverReview(groups, cls);
  } catch (e) {
    ctl.close();
    showGmailErrorSheet(e, () => { DISC.busy = GM.busy = false; startDiscovery(period, entered); });
  } finally { if (!handedOff || !DISC.reviewOpen) { DISC.busy = false; GM.busy = false; } }
}

/* ===== Suora Gmail-yhteys puhelinversiossa (PWA) =====
   Google-kirjautuminen (OAuth implicit, vain lukulupa gmail.readonly). Pääsytunnus pidetään VAIN muistissa:
   sitä ei tallenneta, se vanhenee tunnissa ja unohdetaan lukittaessa. Pyynnöt menevät vain gmail.googleapis.com:iin (CSP).
   Gmail API -vastaukset muunnetaan samaan muotoon kuin claude.ai:n Gmail-yhdistäjän, joten haku ja etsintä toimivat samalla koodilla. */
const GOAUTH = { token: '', exp: 0, error: '', intent: '', announced: false, editClient: false };
const GMAIL_API = 'https://gmail.googleapis.com/gmail/v1/users/me/';
// Vain selaimessa ajettava PWA (https tai localhost); ei claude.ai-versiossa eikä natiivisovelluksessa (paluuosoite ei toimi siellä)
function gmailRestCapable() {
  try {
    if (window.HAKUVIESTIT_STANDALONE !== true || isNativeApp() || typeof location === 'undefined' || !location) return false;
    return location.protocol === 'https:' || location.hostname === 'localhost' || location.hostname === '127.0.0.1';
  } catch (e) { return false; }
}
const gmailRestReady = () => !!GOAUTH.token && Date.now() < GOAUTH.exp;
const gmailClientId = () => String(settings().gmailClientId || '').trim();
const gmailRestMinutes = () => Math.max(0, Math.round((GOAUTH.exp - Date.now()) / 60000));

async function gmailFetch(path) {
  if (!gmailRestReady()) { gmailRestForget(); throw { code: 'oauth_expired', message: 'Ei kirjautumista' }; }
  let res;
  try {
    res = await fetch(GMAIL_API + path, { headers: { Authorization: 'Bearer ' + GOAUTH.token }, cache: 'no-store', credentials: 'omit', referrerPolicy: 'no-referrer' });
  } catch (e) { throw { code: 'server_unavailable', retryable: true, retryAfterMs: 1500, message: 'Ei yhteyttä Gmailiin' }; }
  if (res.ok) return res.json();
  let body = null; try { body = await res.json(); } catch (e) { body = null; }
  const err = gmailHttpError(res.status, body, res.headers && res.headers.get ? res.headers.get('Retry-After') : null);
  if (err.code === 'oauth_expired') gmailRestForget();
  throw err;
}
// Rajattu rinnakkaisuus (Gmailin kiintiö): enintään n pyyntöä kerralla
async function gmailMapLimit(items, n, fn) {
  const out = new Array(items.length); let next = 0;
  const worker = async () => { while (next < items.length) { const i = next++; out[i] = await fn(items[i], i); } };
  await Promise.all(Array.from({ length: Math.min(n, items.length) }, worker));
  return out;
}
const META_Q = 'format=metadata&metadataHeaders=From&metadataHeaders=To&metadataHeaders=Cc&metadataHeaders=Subject&metadataHeaders=Date';
// Yhdistäjän työkalut REST-kutsuina. Vain lukeminen: lähetys ei ole mahdollista (ei lähetyslupaa).
async function gmailRestTool(tool, input) {
  if (tool === 'search_threads') {
    const q = ['q=' + encodeURIComponent(input.query || ''), 'maxResults=' + Math.min(100, Math.max(1, Number(input.pageSize) || 20))];
    if (input.pageToken) q.push('pageToken=' + encodeURIComponent(input.pageToken));
    const j = await gmailFetch('threads?' + q.join('&'));
    const ids = (j.threads || []).map(t => t && t.id).filter(Boolean);
    if (input.view === 'THREAD_VIEW_IDS_ONLY') return { threads: ids.map(id => ({ id })), nextPageToken: j.nextPageToken || undefined };
    const threads = await gmailMapLimit(ids, 5, async id => {
      const t = await gmailFetch('threads/' + encodeURIComponent(id) + '?' + META_Q);
      return { id, messages: (t.messages || []).map(m => gmailApiMsg(m, false)).filter(Boolean) };
    });
    return { threads, nextPageToken: j.nextPageToken || undefined };
  }
  if (tool === 'get_thread') {
    const t = await gmailFetch('threads/' + encodeURIComponent(input.threadId) + '?format=full');
    return { id: t.id, messages: (t.messages || []).map(m => gmailApiMsg(m, true)).filter(Boolean) };
  }
  throw { code: 'not_supported', message: 'Ei tuettu puhelinversiossa' };
}
const gmailRestBackend = { rest: true, callTool: async (server, tool, input) => ({ payload: await gmailRestTool(tool, input || {}) }) };

function gmailRestForget() {
  GOAUTH.token = ''; GOAUTH.exp = 0;
  if (S.mcp === gmailRestBackend) S.mcp = null;
}
function gmailRestUse() { if (gmailRestReady()) S.mcp = gmailRestBackend; }

// Paluu Googlen kirjautumisesta: token talteen muistiin ja fragmentti heti pois osoiteriviltä/historiasta
function gmailCaptureOAuth() {
  if (!gmailRestCapable()) return;
  let r = null; try { r = parseOAuthFragment(location.hash); } catch (e) { r = null; }
  if (!r) return;
  try { history.replaceState(null, '', location.pathname + location.search); } catch (e) { try { location.hash = ''; } catch (e2) { /* ok */ } }
  const want = lsGet('hv-oauth-state') || '';
  GOAUTH.intent = lsGet('hv-oauth-intent') || '';
  lsDel('hv-oauth-state'); lsDel('hv-oauth-intent');
  if (r.error) { GOAUTH.error = r.error === 'access_denied' ? 'denied' : 'error'; return; }
  if (!want || r.state !== want || !r.token) { GOAUTH.error = 'state'; return; }
  if (r.scope && !r.scope.split(/\s+/).includes(GMAIL_SCOPE)) { GOAUTH.error = 'scope'; return; }
  GOAUTH.token = r.token; GOAUTH.exp = Date.now() + Math.max(60, r.expiresIn - 60) * 1000;
  gmailRestUse();
}
gmailCaptureOAuth();

function randomState() {
  const b = _rand(16);
  return Array.from(b, x => x.toString(16).padStart(2, '0')).join('');
}
// Siirtyy Googlen kirjautumissivulle. intent: 'discover' = avaa työpaikkakeskustelujen etsintä palattua.
async function gmailConnect(intent) {
  if (!gmailRestCapable()) return;
  const cid = gmailClientId();

  if (!go) return;

// Kutsutaan lukituksen avauksen jälkeen: kerrotaan kirjautumisen tulos kerran ja jatketaan aloitettua toimintoa
function gmailAfterUnlock() {
  if (!gmailRestCapable() || GOAUTH.announced) return;
  if (!GOAUTH.error && !GOAUTH.token) return;
  GOAUTH.announced = true;
  if (GOAUTH.error) {
    const t = { denied: 'Google-kirjautuminen peruttiin.', scope: 'Gmailin lukulupaa ei annettu. Kirjaudu uudelleen ja salli sähköpostien lukeminen.', state: 'Kirjautumista ei voitu varmistaa. Yritä uudelleen.' }[GOAUTH.error] || 'Google-kirjautuminen epäonnistui.';

      h('button', { class: 'btn', type: 'button', id: 'imp-cancel', text: 'Peruuta', onclick: leaveReview }),
      h('button', { class: 'btn primary', type: 'button', id: 'imp-go', text: 'Tuo viestejä', onclick: executeImport }))));
  renderGroups();
}
async function executeImport() {
  const st = S.imp; if (!st || st.running) return;
  st.running = true; $('#imp-go').disabled = true;
  const tmpIds = {}; st.tmp.forEach(t => { tmpIds[t.id] = newChatId(); });
  const targetOf = g => g.choice.startsWith('tmp:') ? tmpIds[g.choice.slice(4)] : g.choice.slice(5);
  const perChat = new Map(), skippedGroups = [];
  for (const g of st.groups) {
    if (g.choice === 'skip') { if (st.saveSkipped) skippedGroups.push(g); continue; }
    const cid = targetOf(g); if (!cid) continue;
    if (!perChat.has(cid)) perChat.set(cid, []);
    perChat.get(cid).push(g);
  }
  const finalize = m => {
    const at = m.at && !isNaN(Date.parse(m.at)) ? new Date(m.at).toISOString() : nowIso();
    const data = toMsgDoc(Object.assign({}, m, { at, source: m.source || st.source, createdAt: nowIso() }));
    const id = msgIdOf({ messageId: m.messageId, from: data.from, at: data.at, subject: data.subject, body: data.body });
    return { id, data };
  };
  const phoneOf = g => { if (g.phone) return g.phone; const p = normPhone(g.extraPhone || ''); return isPhone(p) ? p : ''; };
  const ops = [], statOps = [], imported = new Set(); let msgCount = 0, now = nowIso();
  for (const [cid, gs] of perChat) {
    const docMap = new Map();
    gs.forEach(g => g.msgs.forEach(m => { const d = finalize(m); docMap.set(d.id, d); }));
    const docs = [...docMap.values()];
    const tmp = st.tmp.find(t => tmpIds[t.id] === cid);
    if (tmp) {
      const members = [];
      gs.forEach(g => ensureMember(members, { name: g.name, email: g.email, phone: phoneOf(g) }, uid));
      ops.push({ t: 'set', path: 'chats/' + cid, data: {
        name: tmp.name, company: tmp.company, status: 'haettu', notes: '', color: 'av' + (fnv32(tmp.name) % 6 + 1), members,
        createdAt: now, updatedAt: now, stats: computeStats(docs.map(d => d.data))
      } });
    } else {
      const chat = S.chats[cid]; if (!chat) continue;
      const members = clone(chat.members || []);
      gs.forEach(g => ensureMember(members, { name: g.name, email: g.email, phone: phoneOf(g) }, uid));
      if (JSON.stringify(members) !== JSON.stringify(chat.members || [])) ops.push({ t: 'update', path: 'chats/' + cid, data: { members, updatedAt: now } });
      statOps.push(statsOp(cid, docs.map(d => Object.assign({ id: d.id }, d.data)), []));
    }
    docs.forEach(d => { ops.push({ t: 'set', path: 'chats/' + cid + '/messages/' + d.id, data: d.data }); imported.add(d.id); msgCount++; });
  }
  // Lajittelemattomat: poista tuodut, lisää ohitetut, rajaa 400:aan
  const keepExisting = S.unsorted.filter(u => !imported.has(u.id));
  S.unsorted.filter(u => imported.has(u.id)).forEach(u => ops.push({ t: 'del', path: 'unsorted/' + u.id }));
  const newUns = new Map();
  skippedGroups.forEach(g => g.msgs.forEach(m => { const d = finalize(m); if (!imported.has(d.id)) newUns.set(d.id, { id: d.id, data: Object.assign(d.data, { suggestedName: g.name || g.email || g.phone || '' }) }); }));
  const all = keepExisting.map(u => ({ id: u.id, at: u.at, old: true })).concat([...newUns.values()].map(u => ({ id: u.id, at: u.data.at, old: false })));
  all.sort((a, b) => (Date.parse(a.at) || 0) - (Date.parse(b.at) || 0));
  const drop = new Set(all.slice(0, Math.max(0, all.length - MAX_UNSORTED)).map(x => x.id));
  keepExisting.forEach(u => { if (drop.has(u.id)) ops.push({ t: 'del', path: 'unsorted/' + u.id }); });
  newUns.forEach(u => { if (!drop.has(u.id)) ops.push({ t: 'set', path: 'unsorted/' + u.id, data: u.data }); });
  const unsCount = [...newUns.keys()].filter(id => !drop.has(id)).length;
  const total = ops.length + statOps.length;
  if (!total) { st.running = false; toast('Ei tuotavaa'); renderGroups(); return; }
  const pg = showProgress('Tuodaan viestejä', total);
  const r1 = await runWrites(ops, { onProgress: n => pg.set(n) });
  let err = r1.error;
  if (!err) { const r2 = await runWrites(statOps, { offset: ops.length, onProgress: n => pg.set(n) }); err = r2.error; }
  pg.close();
  st.running = false;
  S.sum.sig = '';
  if (err) { toast(errText(err), 'bad'); renderGroups(); return; }
  st.result = { msgs: msgCount, chats: perChat.size, uns: unsCount };
  renderResult();
}
function renderResult() {
  const r = S.imp.result, box = imp.ui.review;
  box.replaceChildren(h('div', { class: 'card', id: 'imp-result' },
    h('h3', { text: 'Tuotiin ' + r.msgs + ' viestiä ' + r.chats + ' keskusteluun' }),
    h('p', { text: (r.uns ? r.uns + ' viestiä tallennettiin lajittelemattomiin. ' : '') + 'Sama viesti ei tuplaannu, vaikka tuot saman tiedoston uudelleen.' }),
    h('div', { class: 'btn-row' },
      h('button', { class: 'btn primary', type: 'button', id: 'imp-open', text: 'Avaa keskustelut', onclick: () => { leaveReview(); showView('chats'); } }),
      h('button', { class: 'btn', type: 'button', id: 'imp-again', text: 'Tuo lisää', onclick: leaveReview }))));
}

/* ===== Laitetunnistus ja asettelu ===== */
const mm = q => { try { return !!(window.matchMedia && window.matchMedia(q).matches); } catch (e) { return false; } };
// mobile < 700 px, tablet 700-1099 px, desktop >= 1100 px. Kosketuslaite ilman hoveria ei muutu desktopiksi.
function detectDevice() {
  const w = window.innerWidth || 390;
  let d = w < 700 ? 'mobile' : w < 1100 ? 'tablet' : 'desktop';
  const touchOnly = mm('(pointer: coarse)') && !mm('(hover: hover)');
  let uaMobile = null;
  try { uaMobile = navigator.userAgentData && navigator.userAgentData.mobile; } catch (e) { /* ei tukea */ }
  if (d === 'desktop' && (touchOnly || uaMobile === true)) d = 'tablet';
  return d;
}
function detectInput() { return (mm('(pointer: coarse)') && !mm('(hover: hover)')) ? 'touch' : 'mouse'; }
const DEVICE_LABEL = { mobile: 'Puhelin', tablet: 'Tabletti', desktop: 'Tietokone' };
function updateDeviceLine() {
  const el = $('#acc-device'); if (!el) return;
  el.textContent = 'Laite: ' + DEVICE_LABEL[S.device] + ' · ' + (S.input === 'touch' ? 'kosketus' : 'hiiri');
}
function setLayout(split) {
  document.documentElement.dataset.layout = split ? 'split' : 'single';
  if (split === S.split) return;
  S.split = split;
  const main = $('#main'), sp = $('#split'), tb = $('#tabbar');
  if (!sp) return;
  if (split) {
    $('#left-list').append(views.chats.root);
    ['chat', 'summary', 'import', 'accounts', 'unsorted'].forEach(k => $('#right').append(views[k].root));
    $('#left-nav').append(tb);
    sp.hidden = false; main.hidden = true;
  } else {
    Object.keys(views).forEach(k => main.append(views[k].root));
    document.body.insertBefore(tb, $('#layers'));
    sp.hidden = true; main.hidden = false;
  }
  showView(S.view, true);
  if (S.openId && stick.on) setTimeout(progScroll, 0);
}
function applyDevice() {
  const d = detectDevice(), inp = detectInput();
  S.device = d; S.input = inp;
  document.documentElement.dataset.device = d;
  document.documentElement.dataset.input = inp;
  setLayout(d !== 'mobile');
  updateDeviceLine();
}
function watchDevice() {
  if (watchDevice.done) return; watchDevice.done = true;
  let t = null;
  const later = () => { clearTimeout(t); t = setTimeout(() => applyDevice(), 150); };
  window.addEventListener('resize', later);
  window.addEventListener('orientationchange', later);
  ['(pointer: coarse)', '(hover: hover)'].forEach(q => {
    try {
      const m = window.matchMedia(q);
      if (m.addEventListener) m.addEventListener('change', later); else if (m.addListener) m.addListener(later);
    } catch (e) { /* ei matchMediaa */ }
  });
}
function stepChat(dir) {
  const ids = S.visibleIds; if (!ids.length) return;
  const i = ids.indexOf(S.openId);
  const n = i < 0 ? (dir > 0 ? 0 : ids.length - 1) : Math.min(ids.length - 1, Math.max(0, i + dir));
  if (ids[n] === S.openId) return;
  openChat(ids[n]);
  const r = $('#chat-' + ids[n]); if (r && r.scrollIntoView) r.scrollIntoView({ block: 'nearest' });
}
// Pikanäppäimet (vain tietokone); sheetit hoitavat Escin itse
function desktopKeys(e) {
  if (S.device !== 'desktop') return;
  if ((e.ctrlKey || e.metaKey) && (e.key === 'k' || e.key === 'K')) {
    e.preventDefault(); const q = $('#q'); if (q) { q.focus(); if (q.select) q.select(); } return;
  }
  if (e.key === 'Escape') {
    const a = document.activeElement;
    if (a && a.id === 'q' && a.value) { a.value = ''; S.q = ''; renderChatList(); return; }
    if (a && a.blur && (a.tagName === 'TEXTAREA' || a.tagName === 'INPUT')) a.blur();
    if (S.openId) closeChat();
    return;
  }
  if (e.altKey && (e.key === 'ArrowDown' || e.key === 'ArrowUp')) { e.preventDefault(); stepChat(e.key === 'ArrowDown' ? 1 : -1); }
}

/* ===== Käynnistys ===== */
// Natiivikuori (WKWebView): ankkuri/blob-lataus ei toimi. Kirjoitetaan väliaikaistiedosto ja avataan iOS:n jakamisvalikko ("Tallenna tiedostoihin").
// Varmuuskopio on jo salattu (exportBackup), joten tiedosto ei sisällä selväkielistä dataa.
async function nativeSaveFile(req) {
  const FS = nativePlugin('Filesystem'), SH = nativePlugin('Share');
  if (!FS || !SH) throw { code: 'unavailable', message: 'tallennus ei ole käytettävissä' };
  try {
    const r = await FS.writeFile({ path: req.filename, data: req.data, directory: 'CACHE', encoding: 'utf8' });
    if (!r || !r.uri) throw { code: 'unavailable', message: 'tiedoston kirjoitus epäonnistui' };
    await SH.share({ title: req.filename, url: r.uri, dialogTitle: 'Tallenna varmuuskopio' });
    return { status: 'saved' };
  } catch (e) {
    if (e && /cancel/i.test(String(e.message || ''))) throw { code: 'declined', message: 'peruttu' };   // jakamisvalikko suljettiin ("Share canceled")
    throw e;
  } finally {
    try { await FS.deleteFile({ path: req.filename, directory: 'CACHE' }); } catch (e) { /* ei väliä */ }
  }
}
function standaloneDownloads() {
  return {
    async save(req) {
      if (isNativeApp()) return nativeSaveFile(req);
      const blob = new Blob([req.data], { type: 'application/json' });
      try {
        const file = new File([blob], req.filename, { type: 'application/json' });
        if (navigator.canShare && navigator.canShare({ files: [file] })) { await navigator.share({ files: [file] }); return { status: 'saved' }; }
      } catch (e) {
        if (e && e.name === 'AbortError') throw { code: 'declined', message: 'peruttu' };
      }
      const url = URL.createObjectURL(blob);
      const a = h('a', { href: url, download: req.filename, style: 'display:none' });
      document.body.append(a); a.click(); a.remove();
      setTimeout(() => URL.revokeObjectURL(url), 15000);
      return { status: 'saved' };
    }
  };
}

async function init() {
  lockButtonsInit();
  showLoadingLock();
  const claude = window.claude;
  const getCap = async n => { try { return claude && claude.use ? await claude.use(n) : null; } catch (e) { return null; } };
  let db = null;
  if (!STANDALONE) {
    const caps = await Promise.all([getCap('user'), getCap('db')]);
    db = caps[1];
    if (caps[0]) {
      try {
        if ((await caps[0].isOwner()) === false) {
          $('#lock').hidden = true;

  else {
    getCap('downloads').then(d => { S.downloads = d; renderAccounts(); });

    }

  }

}
